name: Build APK (manual)

# Run from the GitHub "Actions" tab -> "Build APK (manual)" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Test & build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies/build cache and validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit & UI tests (JVM / Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name artifact
        id: meta
        run: echo "name=tringapps-debug-${GITHUB_SHA::7}-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        env:
          ARTIFACT: ${{ steps.meta.outputs.name }}
        run: |
          {
            echo "### Debug APK ready"
            echo ""
            echo "Download **${ARTIFACT}** from the *Artifacts* section of this run (kept for 14 days),"
            echo "unzip it and install with \`adb install app-debug.apk\`."
          } >> "$GITHUB_STEP_SUMMARY"
